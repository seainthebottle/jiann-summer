<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyTimer - 공부 시간 관리</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="/assets/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="light-theme">
    <div id="app">
        <!-- 네비게이션 바 -->
        <nav id="navbar" class="hidden">
            <div class="nav-container">
                <a href="#" class="logo" data-page="dashboard">StudyTimer</a>
                <div class="nav-links">
                    <a href="#" data-page="dashboard" title="대시보드" style="display: flex; align-items: center;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                    </a>
                    <a href="#" data-page="stats" title="통계" style="display: flex; align-items: center;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="20" x2="18" y2="10"></line>
                            <line x1="12" y1="20" x2="12" y2="4"></line>
                            <line x1="6" y1="20" x2="6" y2="14"></line>
                        </svg>
                    </a>
                    <a href="#" data-page="admin" id="admin-link" class="hidden" title="관리자"
                        style="display: flex; align-items: center;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                            </path>
                        </svg>
                    </a>

                    <button id="theme-toggle" title="테마 변경" style="display: flex; align-items: center;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M12 2a10 10 0 0 0 0 20z"></path>
                        </svg>
                    </button>
                    <button id="logout-btn" title="로그아웃" style="display: flex; align-items: center;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                    </button>
                </div>
            </div>
        </nav>

        <main class="container">
            <!-- 로그인/회원가입 섹션 -->
            <section id="auth-page" class="auth-container">
                <div class="auth-card">
                    <h1 id="auth-title">로그인</h1>
                    <form id="login-form">
                        <div class="form-group">
                            <label for="username">아이디</label>
                            <input type="text" id="username" name="username" required autocomplete="username">
                        </div>
                        <div class="form-group">
                            <label for="password">비밀번호</label>
                            <input type="password" id="password" name="password" required
                                autocomplete="current-password">
                        </div>
                        <button type="submit" class="btn-primary">로그인</button>
                    </form>
                    <p class="auth-switch">계정이 없으신가요? <a href="#" id="show-register">회원가입</a></p>
                </div>
            </section>

            <!-- 대시보드 섹션 -->
            <section id="dashboard-page" class="hidden">
                <div class="dashboard-header">
                    <h2>오늘의 공부</h2>


                    <div id="timer-display">00:00:00</div>
                    <div id="today-stats-container" class="today-stats-grid">
                        <div class="stat-item">
                            <span class="label">오늘 총 공부</span>
                            <span id="today-total-time" class="value">0시간 0분 0초</span>
                        </div>
                        <div id="today-subject-card" class="stat-item hidden">
                            <span id="today-subject-label" class="label">오늘 과목 공부</span>
                            <span id="today-subject-time" class="value">0시간 0분 0초</span>
                        </div>
                    </div>
                </div>

                <div class="study-controls">
                    <div class="form-group">
                        <label for="subject-select">공부할 과목</label>
                        <select id="subject-select">
                            <option value="">과목을 선택하세요</option>
                        </select>
                    </div>
                    <button id="study-toggle-btn" class="btn-start" disabled>과목을 선택하세요</button>
                </div>

            </section>

            <!-- 통계 섹션 -->
            <section id="stats-page" class="hidden">
                <div class="header-with-action">
                    <h2>공부 통계</h2>
                    <div id="admin-user-select-container" class="hidden">
                        <label for="admin-user-select">사용자 선택:</label>
                        <select id="admin-user-select"></select>
                    </div>
                </div>

                <div class="stats-filters" style="display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="stats-date-select">기준일 선택:</label>
                        <div class="date-nav" style="display: flex; align-items: center; gap: 5px;">
                            <button id="stats-prev-date" class="btn-icon" title="이전 날짜">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="15 18 9 12 15 6"></polyline>
                                </svg>
                            </button>
                            <input type="date" id="stats-date-select" style="width: auto; padding: 8px 12px;">
                            <button id="stats-next-date" class="btn-icon" title="다음 날짜">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="9 18 15 12 9 6"></polyline>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="stats-subject-select">과목 필터:</label>
                        <select id="stats-subject-select">
                            <option value="">모든 과목</option>
                        </select>
                    </div>
                </div>
                <div class="stats-grid">
                    <div class="stats-card">
                        <h3>선택일 시간별 공부 분포</h3>
                        <div class="chart-container">
                            <canvas id="daily-pie-chart"></canvas>
                        </div>
                    </div>
                    <div class="stats-card">
                        <h3>시간 요약</h3>
                        <ul class="stats-list">
                            <li>선택일 총 공부시간: <span id="stat-daily">0분</span></li>
                            <li>최근 7일 합계: <span id="stat-weekly">0분</span></li>
                            <li>최근 30일 합계: <span id="stat-monthly">0분</span></li>
                            <li>주간 일평균: <span id="stat-weekly-avg">0분</span></li>
                            <li>월간 일평균: <span id="stat-monthly-avg">0분</span></li>
                        </ul>
                    </div>
                    <div class="stats-card">
                        <h3>과목별 공부 시간</h3>
                        <div id="subject-stats-legend" class="subject-legend">
                            <!-- 과목별 범례 및 합계가 여기에 표시됨 -->
                        </div>
                    </div>
                </div>
            </section>

            <!-- 관리자 섹션 -->
            <section id="admin-page" class="hidden">
                <h2>관리자 페이지</h2>

                <div class="admin-grid">
                    <div class="admin-card">
                        <h3>과목 관리</h3>
                        <form id="add-subject-form">
                            <div
                                style="display: flex; gap: 10px; width: 100%; align-items: center; margin-bottom: 15px;">
                                <input type="color" id="new-subject-color" value="#339af0"
                                    style="padding: 0; width: 40px; height: 38px;">
                                <input type="text" id="new-subject-name" placeholder="새 과목 이름" required
                                    style="margin-bottom: 0; flex: 1;">
                                <button type="submit" class="btn-small">추가</button>
                            </div>
                        </form>
                        <ul id="admin-subject-list" class="item-list"></ul>
                    </div>

                    <div class="admin-card">
                        <h3>사용자 관리</h3>
                        <form id="add-user-form">
                            <div class="form-group">
                                <input type="text" id="new-username" placeholder="아이디" required>
                            </div>
                            <div class="form-group">
                                <input type="password" id="new-password" placeholder="비밀번호" required>
                            </div>
                            <div class="form-group">
                                <select id="new-role">
                                    <option value="user">일반 사용자</option>
                                    <option value="admin">관리자</option>
                                </select>
                            </div>
                            <button type="submit" class="btn-small" style="width: 100%; padding: 12px;">추가</button>
                        </form>
                        <ul id="admin-user-list" class="item-list"></ul>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 스크립트 모듈 -->
    <script src="js/api.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/chart.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
